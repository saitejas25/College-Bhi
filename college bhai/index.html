    // --- Audio Chime via Web Audio API ---
    const playZenChime = () => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
        osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.15); // E5
        osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.35); // G5
        osc.frequency.exponentialRampToValueAtTime(1046.50, ctx.currentTime + 0.6); // C6
        
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.8);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 1.8);
      } catch (e) {
        console.error("Audio error", e);
      }
    };

    // --- Helper: Days Difference Calculation ---
    const getDaysDiff = (dateStr) => {
      if (!dateStr) return 0;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const parts = dateStr.split('-');
      if (parts.length !== 3) return 0;
      const target = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
      target.setHours(0, 0, 0, 0);
      const diffTime = target.getTime() - today.getTime();
      return Math.round(diffTime / (1000 * 60 * 60 * 24));
    };

      const text = title.toLowerCase();
      if (/\b(exam|examination|assessment|test|quiz|mid[- ]?term|semester end)\b/.test(text)) return 'Exams';
      if (/\b(hackathon|coding challenge|codefest)\b/.test(text)) return 'Hackathons';
      if (/\b(fest|festival|cultural|annual day|concert|celebration)\b/.test(text)) return 'Festivals';
      if (/\b(workshop|bootcamp|training|hands[- ]?on)\b/.test(text)) return 'Workshops';
      if (/\b(seminar|webinar|talk|lecture|conference|symposium)\b/.test(text)) return 'Seminars';
      return 'Club Meets';
    };

    const parseCalendarDate = (value) => {
      const iso = value.match(/\b(20\d{2})[-/](\d{1,2})[-/](\d{1,2})\b/);
      if (iso) return `${iso[1]}-${iso[2].padStart(2, '0')}-${iso[3].padStart(2, '0')}`;

      const numeric = value.match(/\b(\d{1,2})[./-](\d{1,2})[./-](20\d{2})\b/);
      if (numeric) return `${numeric[3]}-${numeric[2].padStart(2, '0')}-${numeric[1].padStart(2, '0')}`;

      const named = value.match(/\b(\d{1,2})(?:st|nd|rd|th)?\s+(Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)[, ]*\s*(20\d{2})\b/i) ||
        value.match(/\b(Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\s+(\d{1,2})(?:st|nd|rd|th)?[,]?\s*(20\d{2})\b/i) ||
        value.match(/\b(\d{1,2})(?:st|nd|rd|th)?\s+(Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\b/i) ||
        value.match(/\b(Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\s+(\d{1,2})(?:st|nd|rd|th)?\b/i);
      if (!named) return '';

      const monthNames = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
      const monthFirst = /^[a-z]/i.test(named[1]);
      const day = Number(monthFirst ? named[2] : named[1]);
      const monthText = monthFirst ? named[1] : named[2];
      const year = Number(named[3] || new Date().getFullYear());
      const month = monthNames.findIndex(name => name === monthText.slice(0, 3).toLowerCase()) + 1;
      if (!month || day < 1 || day > 31) return '';
      return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    };

    const parseCalendarPdfPages = (pages) => {
      const events = [];
      const datePattern = /\b(?:20\d{2}[-/]\d{1,2}[-/]\d{1,2}|\d{1,2}[./-]\d{1,2}[./-]20\d{2}|\d{1,2}(?:st|nd|rd|th)?\s+(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)(?:[, ]*\s*20\d{2})?|(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\s+\d{1,2}(?:st|nd|rd|th)?(?:[,]?\s*20\d{2})?)\b/i;
      const timePattern = /\b(?:(?:[01]?\d|2[0-3]):[0-5]\d(?:\s*(?:a\.?m\.?|p\.?m\.?))?|\d{1,2}\s*(?:a\.?m\.?|p\.?m\.?))\b/i;

      pages.forEach(pageItems => {
        const lines = [];
        pageItems.forEach(item => {
          const text = (item.str || '').replace(/\s+/g, ' ').trim();
          if (!text) return;
          const y = item.transform?.[5] || 0;
          let line = lines.find(candidate => Math.abs(candidate.y - y) <= 3);
          if (!line) {
            line = { y, items: [] };
            lines.push(line);
          }
          line.items.push({ text, x: item.transform?.[4] || 0 });
        });
        lines.sort((a, b) => b.y - a.y);

        lines.forEach(line => {
          line.items.sort((a, b) => a.x - b.x);
          const raw = line.items.map(item => item.text).join(' ').replace(/\s+/g, ' ').trim();
          const dateMatch = raw.match(datePattern);
          if (!dateMatch) return;
          const date = parseCalendarDate(dateMatch[0]);
          if (!date) return;
          const timeMatch = raw.match(timePattern);
          const time = timeMatch ? timeMatch[0].replace(/\s+/g, ' ').toUpperCase().replace(/\./g, '') : 'Time not specified';
          const title = raw
            .replace(dateMatch[0], ' ')
            .replace(timeMatch?.[0] || '', ' ')
            .replace(/\b(?:event|calendar|date|time|venue|location)\b\s*[:|-]?/gi, ' ')
            .replace(/[|•·]+/g, ' ')
            .replace(/\s+/g, ' ')
            .replace(/^[\s:;,.-]+|[\s:;,.-]+$/g, '')
            .trim();
          if (title.length < 3 || /^(event|holiday|calendar|important dates)$/i.test(title)) return;
          const venueMatch = title.match(/\b(?:auditorium|seminar hall|main hall|campus center|sports ground|room|block)\s*[-:]?\s*[a-z0-9 -]*/i);
          const venue = venueMatch ? venueMatch[0].trim() : 'Campus Center';
          const cleanTitle = venueMatch ? title.replace(venueMatch[0], '').trim() : title;
          if (!cleanTitle) return;
          const event = {
            id: `ev-import-${Date.now()}-${events.length}`,
            title: cleanTitle,
            category: categorizeCalendarEvent(cleanTitle),
            date,
            time,
            venue,
            description: '',
            rsvp: 'none'
          };
          if (!events.some(existing => existing.date === event.date && existing.title.toLowerCase() === event.title.toLowerCase())) {
            events.push(event);
          }
        });
      });
      return events;
    };

    const parseTimetablePdfPages = (pages) => {
      const schedule = {};
      const dayPattern = new RegExp(`\\b(${TIMETABLE_DAYS.join('|')})\\b`, 'i');
      const timePattern = /\b\d{1,2}(?::|\.)\d{2}\s*(?:a\.?m\.?|p\.?m\.?)?\s*(?:-|–|—|to)\s*\d{1,2}(?::|\.)\d{2}\s*(?:a\.?m\.?|p\.?m\.?)?\b/i;
      let foundRows = 0;

      const addSlot = (day, time, subject) => {
        const cleanSubject = subject
          .replace(/[|•·]+/g, ' ')
          .replace(/\s+/g, ' ')
          .replace(/^[\s:;,.-]+|[\s:;,.-]+$/g, '')
          .trim();
        if (!day || !cleanSubject || cleanSubject.length < 2) return;
        const roomMatch = cleanSubject.match(/\b(?:room\s*[-:]?\s*[a-z0-9-]+|lh\s*[-:]?\s*\d+[a-z]?|lab\s*[-:]?\s*\d+[a-z]?|block\s*[-:]?\s*[a-z0-9-]+|hall\s*[-:]?\s*[a-z0-9-]+)\b/i);
        const room = roomMatch ? roomMatch[0].trim() : '';
        const name = roomMatch ? cleanSubject.replace(roomMatch[0], '').trim() : cleanSubject;
        if (!name) return;
        const slot = {
          time: time || 'Time not specified',
          subject: name,
          room,
          type: /\blab\b/i.test(name) ? 'Lab' : 'Lecture'
        };
        if (!schedule[day]) schedule[day] = [];
        if (!schedule[day].some(existing => existing.time === slot.time && existing.subject === slot.subject && existing.room === slot.room)) {
          schedule[day].push(slot);
          foundRows++;
        }
      };

      pages.forEach(pageItems => {
        const lines = [];
        pageItems.forEach(item => {
          const text = (item.str || '').replace(/\s+/g, ' ').trim();
          if (!text) return;
          const y = item.transform?.[5] || 0;
          let line = lines.find(candidate => Math.abs(candidate.y - y) <= 3);
          if (!line) {
            line = { y, items: [] };
            lines.push(line);
          }
          line.items.push({ text, x: item.transform?.[4] || 0 });
        });
        lines.sort((a, b) => b.y - a.y);

        let headerColumns = [];
        let activeDay = '';
        let activeDayTime = '';
        lines.forEach(line => {
          line.items.sort((a, b) => a.x - b.x);
          const fullText = line.items.map(item => item.text).join(' ');
          const dayMatches = [...fullText.matchAll(new RegExp(`\\b(${TIMETABLE_DAYS.join('|')})\\b`, 'gi'))];

          if (dayMatches.length > 1) {
            headerColumns = line.items
              .map(item => {
                const match = item.text.match(dayPattern);
                return match ? { day: TIMETABLE_DAYS.find(day => day.toLowerCase() === match[1].toLowerCase()), x: item.x } : null;
              })
              .filter(Boolean);
            activeDay = '';
            return;
          }

          const dayMatch = fullText.match(dayPattern);
          const timeMatch = fullText.match(timePattern);
          const time = timeMatch ? timeMatch[0].replace(/\s+/g, ' ').trim() : '';
          const contentItems = line.items
            .map(item => ({
              ...item,
              text: item.text
                .replace(new RegExp(dayPattern.source, 'gi'), ' ')
                .replace(new RegExp(timePattern.source, 'gi'), ' ')
                .trim()
            }))
            .filter(item => item.text);

          if (dayMatch) {
            const day = TIMETABLE_DAYS.find(candidate => candidate.toLowerCase() === dayMatch[1].toLowerCase());
            const content = contentItems.map(item => item.text).join(' ');
            if (time && content) addSlot(day, time, content);
            else if (!time && !content) {
              activeDay = day;
              activeDayTime = '';
            } else if (content && !time) {
              activeDay = day;
              addSlot(day, '', content);
            }
            return;
          }

          if (!contentItems.length) return;
          if (headerColumns.length) {
            const cells = {};
            contentItems.forEach(item => {
              const column = headerColumns.reduce((nearest, current) =>
                Math.abs(current.x - item.x) < Math.abs(nearest.x - item.x) ? current : nearest
              );
              cells[column.day] = cells[column.day] ? `${cells[column.day]} ${item.text}` : item.text;
            });
            Object.entries(cells).forEach(([day, subject]) => {
              if (time) activeDayTime = time;
              addSlot(day, time || activeDayTime, subject);
            });
          } else if (activeDay) {
            if (time) activeDayTime = time;
            addSlot(activeDay, time || activeDayTime, contentItems.map(item => item.text).join(' '));
          }
        });
      });

      return { schedule, foundRows };
    };

    const clearSeededData = () => {
      const migrationKey = 'collegebhai_demo_data_removed_v1';
      if (localStorage.getItem(migrationKey)) return;

      const migrateSeedEntries = (key, legacyKey, isSeedEntry) => {
        try {
          const value = localStorage.getItem(key) || localStorage.getItem(legacyKey);
          if (!value) return;
          const parsed = JSON.parse(value);
          if (Array.isArray(parsed)) {
            localStorage.setItem(key, JSON.stringify(parsed.filter(item => !isSeedEntry(item))));
          }
          if (legacyKey) localStorage.removeItem(legacyKey);
        } catch {
          return;
        }
      };

      try {
        const savedProfile = JSON.parse(localStorage.getItem('collegebhai_profile_v1') || 'null');
        if (savedProfile?.name === 'Rahul Sharma' && savedProfile?.rollNo === '21BCSE104') {
          localStorage.removeItem('collegebhai_profile_v1');
        }
      } catch {
        localStorage.removeItem('collegebhai_profile_v1');
      }
      migrateSeedEntries('collegebhai_subjects_v1', 'campuspulse_subjects_v1', item => /^sub-[1-5]$/.test(item.id));
      migrateSeedEntries('collegebhai_tasks_v1', 'campuspulse_tasks_v1', item => /^task-[1-5]$/.test(item.id));
      migrateSeedEntries('collegebhai_events_v1', 'campuspulse_events_v1', item => /^ev-[1-5]$/.test(item.id));

      try {
        const savedCgpi = JSON.parse(localStorage.getItem('collegebhai_cgpi_v1') || 'null');
        if (savedCgpi?.semesters?.some(semester => /^sem-[1-4]$/.test(semester.id))) {
          localStorage.removeItem('collegebhai_cgpi_v1');
        }
      } catch {
        localStorage.removeItem('collegebhai_cgpi_v1');
      }
      try {
        const savedTimetable = JSON.parse(localStorage.getItem('collegebhai_timetable_v1') || localStorage.getItem('campuspulse_timetable_v1') || 'null');
        if (savedTimetable && Object.values(savedTimetable).some(day => Array.isArray(day) && day.some(slot => slot.subject === 'Hackathon Project Development'))) {
          localStorage.removeItem('collegebhai_timetable_v1');
          localStorage.removeItem('campuspulse_timetable_v1');
        }
        const savedPomodoro = JSON.parse(localStorage.getItem('collegebhai_pomodoro_v1') || localStorage.getItem('campuspulse_pomodoro_v1') || 'null');
        if (savedPomodoro?.completedToday === 3 && savedPomodoro?.totalMinutes === 75) {
          localStorage.removeItem('collegebhai_pomodoro_v1');
          localStorage.removeItem('campuspulse_pomodoro_v1');
        }
      } catch {
        localStorage.removeItem('collegebhai_timetable_v1');
        localStorage.removeItem('campuspulse_timetable_v1');
        localStorage.removeItem('collegebhai_pomodoro_v1');
        localStorage.removeItem('campuspulse_pomodoro_v1');
      }
      localStorage.setItem(migrationKey, 'true');
    };
    clearSeededData();

    // --- MAIN COLLEGE BHAI APP COMPONENT ---

      // 10. Pomodoro State with LocalStorage
      const [pomodoroStats, setPomodoroStats] = useState(() => {

        } catch {

      useEffect(() => {
        localStorage.setItem('collegebhai_pomodoro_v1', JSON.stringify(pomodoroStats));
      }, [pomodoroStats]);

      // 11. CGPI State with LocalStorage
      const [cgpiData, setCgpiData] = useState(() => {
        try {
          const saved = localStorage.getItem('collegebhai_cgpi_v1');
          return saved ? JSON.parse(saved) : { targetCgpi: 8.5, totalDegreeCredits: 160, conversionFormula: 'vtu', semesters: [] };
        } catch {
          return { targetCgpi: 8.5, totalDegreeCredits: 160, conversionFormula: 'vtu', semesters: [] };
        }
      });

      useEffect(() => {
        localStorage.setItem('collegebhai_cgpi_v1', JSON.stringify(cgpiData));
      }, [cgpiData]);

      // --- Modals State ---
      const [isSubjectModalOpen, setIsSubjectModalOpen] = useState(false);
      const [editingSubject, setEditingSubject] = useState(null);
      const [isTaskModalOpen, setIsTaskModalOpen] = useState(false);
      const [editingTask, setEditingTask] = useState(null);
      const [isEventModalOpen, setIsEventModalOpen] = useState(false);
      const [editingEvent, setEditingEvent] = useState(null);

      // --- Attendance Calculations ---
      const attendanceSummary = useMemo(() => {
        if (!subjects.length) return { overallPercent: 0, totalAttended: 0, totalHeld: 0, atRiskCount: 0, safeCount: 0 };
        let totalAttended = 0;
        let totalHeld = 0;
        let atRiskCount = 0;
        let safeCount = 0;

        subjects.forEach(sub => {
          totalAttended += Number(sub.attended) || 0;
          totalHeld += Number(sub.total) || 0;
          const pct = sub.total > 0 ? (sub.attended / sub.total) * 100 : 100;
          if (pct < (sub.minPercent || 75)) {
            atRiskCount++;
          } else {
            safeCount++;
          }
        });

        const overallPercent = totalHeld > 0 ? ((totalAttended / totalHeld) * 100).toFixed(1) : '100.0';
        return { overallPercent, totalAttended, totalHeld, atRiskCount, safeCount };
      }, [subjects]);

      // --- CGPI Calculations ---
      const cgpiSummary = useMemo(() => {
        const sems = cgpiData.semesters || [];
        let totalCredits = 0;
        let weightedPoints = 0;
        let completedSemestersCount = 0;

        sems.forEach(sem => {
          const creds = Number(sem.credits) || 0;
          const sgpa = Number(sem.sgpa) || 0;
          if (creds > 0 && sgpa > 0) {
            totalCredits += creds;
            weightedPoints += (creds * sgpa);
            completedSemestersCount++;
          }
        });

        const cgpiVal = totalCredits > 0 ? (weightedPoints / totalCredits) : 0;
        const cgpiFormatted = cgpiVal.toFixed(2);

        // Percentage conversion
        let percentage = 0;
        if (cgpiData.conversionFormula === 'aicte') {
          percentage = Math.max(0, (cgpiVal - 0.75) * 10);
        } else if (cgpiData.conversionFormula === 'direct') {
          percentage = cgpiVal * 10;
        } else {
          // 'vtu' or standard engineering (x 9.5)
          percentage = cgpiVal * 9.5;
        }

        // Classification
        let classification = "Pass Class";
        let classificationColor = "text-slate-500";
        if (cgpiVal >= 8.5) {
          classification = "First Class with Distinction ⭐";
          classificationColor = "text-amber-500 dark:text-amber-400";
        } else if (cgpiVal >= 7.0) {
          classification = "First Class 🎓";
          classificationColor = "text-emerald-600 dark:text-emerald-400";
        } else if (cgpiVal >= 6.0) {
          classification = "Second Class";
          classificationColor = "text-sky-600 dark:text-sky-400";
        } else if (cgpiVal > 0) {
          classification = "Pass";
          classificationColor = "text-slate-500";
        }

        // Target Planner
        const targetCgpi = Number(cgpiData.targetCgpi) || 8.5;
        const totalDegreeCredits = Number(cgpiData.totalDegreeCredits) || 160;
        const remainingCredits = Math.max(0, totalDegreeCredits - totalCredits);
        const targetTotalPoints = targetCgpi * totalDegreeCredits;
        const pointsNeeded = targetTotalPoints - weightedPoints;
        const requiredSgpa = remainingCredits > 0 ? (pointsNeeded / remainingCredits) : 0;
        const maxPossibleCgpi = totalDegreeCredits > 0 ? ((weightedPoints + (remainingCredits * 10)) / totalDegreeCredits).toFixed(2) : '10.00';

        return {
          cgpi: cgpiFormatted,
          cgpiNum: cgpiVal,
          totalCredits,
          completedSemestersCount,
          percentage: percentage.toFixed(1),
          classification,
          classificationColor,
          remainingCredits,
          requiredSgpa: requiredSgpa.toFixed(2),
          requiredSgpaNum: requiredSgpa,
          maxPossibleCgpi
        };
      }, [cgpiData]);

      // Trigger Confetti helper
      const triggerConfetti = () => {
        if (window.confetti) {
          window.confetti({
            particleCount: 60,
            spread: 70,
            origin: { y: 0.7 },
            colors: ['#4f75f6', '#10b981', '#f59e0b', '#ec4899']
          });
        }
      };

      // Attendance Actions: + Present, + Absent, Undo
      const handleAttendanceLog = (subjectId, type) => {
        setSubjects(prev => prev.map(sub => {
          if (sub.id !== subjectId) return sub;
          const previousState = { attended: sub.attended, total: sub.total };
          const history = [...(sub.history || []), { type, ...previousState, timestamp: Date.now() }];

          if (type === 'present') {
            return {
              ...sub,
              attended: sub.attended + 1,
              total: sub.total + 1,
              history: history.slice(-5) // keep last 5 actions for undo
            };
          } else if (type === 'absent') {
            return {
              ...sub,
              total: sub.total + 1,
              history: history.slice(-5)
            };
          }
          return sub;
        }));

        if (type === 'present') {
          showToast(`Marked Present for subject! Keep it up!`, 'success');
        } else {
          showToast(`Marked Absent. Remember to catch up on notes.`, 'warning');
        }
      };

      const handleAttendanceUndo = (subjectId) => {
        setSubjects(prev => prev.map(sub => {
          if (sub.id !== subjectId || !sub.history || sub.history.length === 0) return sub;
          const history = [...sub.history];
          const lastAction = history.pop();
          return {
            ...sub,
            attended: lastAction.attended,
            total: lastAction.total,
            history

        }));

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `collegebhai-backup-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);

                      return true;
                    });
                    if (!newEvents.length) {
                      showToast('These events are already in your calendar.', 'info');
                      return;
                    }
                    setEvents(prev => [...prev, ...newEvents]);
                    showToast(`${newEvents.length} event${newEvents.length === 1 ? '' : 's'} added to your calendar.`, 'success');
                  }}
                  onToggleRsvp={(id) => {
                    setEvents(prev => prev.map(ev => {
                      if (ev.id === id) {
                        const nextRsvp = ev.rsvp === 'going' ? 'interested' : ev.rsvp === 'interested' ? 'none' : 'going';
                        showToast(`Status updated to ${nextRsvp.toUpperCase()}`, 'info');
                        return { ...ev, rsvp: nextRsvp };
                      }
                      return ev;
                    }));
                  }}
                  onEditEvent={(ev) => {
                    setEditingEvent(ev);
                    setIsEventModalOpen(true);
                  }}
                  onDeleteEvent={(id) => {
                    if (window.confirm("Remove this event from calendar?")) {
                      setEvents(prev => prev.filter(e => e.id !== id));
                      showToast('Event removed.', 'info');
                    }
                  }}
                />
              </div>
            )}

            {/* FOOTER */}
            <footer className="pt-8 pb-4 border-t border-slate-200 dark:border-dark-border text-center text-xs text-slate-500 dark:text-slate-400">
              <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
                <div className="flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full bg-emerald-500" />
                  <span className="font-semibold text-slate-700 dark:text-slate-300">College Bhai</span>
                  <span>• All data safely preserved locally in your browser storage</span>
                </div>
                <div className="flex items-center gap-4 text-[11px]">
                  <button onClick={handleExportData} className="hover:underline">Export JSON</button>
                </div>
              </div>
            </footer>

          </main>

        </div>

        {/* ================= MODALS ================= */}

        {/* 1. SUBJECT ADD/EDIT MODAL */}
        {isSubjectModalOpen && (
          <SubjectModal
            subject={editingSubject}
            onClose={() => setIsSubjectModalOpen(false)}
            onSave={(savedSubject) => {
              if (editingSubject) {
                setSubjects(prev => prev.map(s => s.id === savedSubject.id ? savedSubject : s));
                showToast('Subject updated!', 'success');
              } else {
                setSubjects(prev => [...prev, savedSubject]);
                triggerConfetti();
                showToast('New subject added!', 'success');
              }
              setIsSubjectModalOpen(false);
            }}
          />
        )}

        {/* 2. TASK ADD/EDIT MODAL */}
        {isTaskModalOpen && (
          <TaskModal
            task={editingTask}
            subjects={subjects}
            onClose={() => setIsTaskModalOpen(false)}
            onSave={(savedTask) => {
              if (editingTask) {
                setTasks(prev => prev.map(t => t.id === savedTask.id ? savedTask : t));
                showToast('Task updated!', 'success');
              } else {
                setTasks(prev => [savedTask, ...prev]);
                showToast('New task created!', 'success');
              }
              setIsTaskModalOpen(false);
            }}
          />
        )}

        {/* 3. EVENT ADD/EDIT MODAL */}
        {isEventModalOpen && (
          <EventModal
            event={editingEvent}
            onClose={() => setIsEventModalOpen(false)}
            onSave={(savedEvent) => {
              if (editingEvent) {
                setEvents(prev => prev.map(e => e.id === savedEvent.id ? savedEvent : e));
                showToast('Event updated!', 'success');
              } else {
                setEvents(prev => [savedEvent, ...prev]);
                triggerConfetti();
                showToast('New campus event added!', 'success');
              }
              setIsEventModalOpen(false);
            }}
          />
        )}

        {/* 4. STUDENT PROFILE MODAL */}
        {isProfileModalOpen && (
          <ProfileModal
            profile={profile}
            onClose={() => setIsProfileModalOpen(false)}
            onSave={(newProfile) => {
              setProfile(newProfile);
              showToast('Profile updated!', 'success');
              setIsProfileModalOpen(false);
            }}
          />
        )}

      </div>
    );
    }

    // --- GRADE OPTIONS FOR CGPI / SGPA CALCULATOR ---
    const GRADE_OPTIONS = [
      { grade: 'O', points: 10, label: 'O (Outstanding • 10)' },
      { grade: 'A+', points: 9, label: 'A+ (Excellent • 9)' },
      { grade: 'A', points: 8, label: 'A (Very Good • 8)' },
      { grade: 'B+', points: 7, label: 'B+ (Good • 7)' },
      { grade: 'B', points: 6, label: 'B (Above Average • 6)' },
      { grade: 'C', points: 5, label: 'C (Average • 5)' },
      { grade: 'P', points: 4, label: 'P (Pass • 4)' },
      { grade: 'F', points: 0, label: 'F (Fail • 0)' },
    ];

    // --- COMPONENT: CGPI & SGPA CALCULATOR MODULE ---
    function CgpiModule({ cgpiData, cgpiSummary, onUpdateCgpiData, triggerConfetti, showToast }) {
      const [selectedSemId, setSelectedSemId] = useState(cgpiData.semesters[0]?.id || null);
      const [showGradingScale, setShowGradingScale] = useState(false);
      const [editingSem, setEditingSem] = useState(null);

      // Form for adding course inside selected semester
      const [newCourse, setNewCourse] = useState({
        name: '',
        credits: 4,
        grade: 'A+',
        points: 9
      });

      const selectedSemester = cgpiData.semesters.find(s => s.id === selectedSemId) || cgpiData.semesters[0];

      // Conversion formulas
      const formulas = [
        { id: 'vtu', name: 'VTU / CBSE / Engg', desc: 'CGPI × 9.5', calc: (v) => (v * 9.5).toFixed(1) },
        { id: 'aicte', name: 'AICTE Standard', desc: '(CGPI - 0.75) × 10', calc: (v) => Math.max(0, (v - 0.75) * 10).toFixed(1) },
        { id: 'direct', name: 'Direct Scale', desc: 'CGPI × 10', calc: (v) => (v * 10).toFixed(1) },
      ];

      const handleFormulaChange = (formulaId) => {
        onUpdateCgpiData({
          ...cgpiData,
          conversionFormula: formulaId
        });
        showToast('Grading conversion formula updated!', 'info');
      };

      const handleTargetCgpiChange = (val) => {
        onUpdateCgpiData({
          ...cgpiData,
          targetCgpi: parseFloat(val) || 8.5
        });
      };

      const handleTotalCreditsChange = (val) => {
        onUpdateCgpiData({
          ...cgpiData,
          totalDegreeCredits: parseInt(val) || 160
        });
      };

      const handleAddSemester = () => {
        const nextNum = cgpiData.semesters.length + 1;
        const newSem = {
          id: `sem-${Date.now()}`,
          name: `Semester ${nextNum}`,
          sgpa: 8.00,
          credits: 22,
          status: 'planned',
          courses: []
        };
        onUpdateCgpiData({
          ...cgpiData,
          semesters: [...cgpiData.semesters, newSem]
        });
        setSelectedSemId(newSem.id);
        triggerConfetti();
        showToast(`Added ${newSem.name}!`, 'success');
      };

      const handleDeleteSemester = (semId) => {
        if (cgpiData.semesters.length <= 1) {
          showToast('You must have at least one semester tracked.', 'warning');
          return;
        }
        if (window.confirm("Remove this semester from CGPI calculation?")) {
          const updated = cgpiData.semesters.filter(s => s.id !== semId);
          onUpdateCgpiData({ ...cgpiData, semesters: updated });
          if (selectedSemId === semId) {
            setSelectedSemId(updated[0]?.id || null);
          }
          showToast('Semester removed.', 'info');
        }
      };

      const handleUpdateSemesterDirect = (semId, fields) => {
        const updated = cgpiData.semesters.map(s => {
          if (s.id === semId) {
            return { ...s, ...fields };
          }
          return s;
        });
        onUpdateCgpiData({ ...cgpiData, semesters: updated });
        showToast('Semester updated.', 'success');
        setEditingSem(null);
      };

      // Add course to semester
      const handleAddCourse = (e) => {
        e.preventDefault();
        if (!newCourse.name.trim()) return;

        const gradeObj = GRADE_OPTIONS.find(g => g.grade === newCourse.grade) || { points: 8 };
        const courseItem = {
          id: `c-${Date.now()}`,
          name: newCourse.name.trim(),
          credits: Number(newCourse.credits) || 3,
          grade: newCourse.grade,
          points: gradeObj.points
        };

        const updatedSemesters = cgpiData.semesters.map(s => {
          if (s.id === selectedSemester.id) {
            const courses = [...(s.courses || []), courseItem];
            const totCredits = courses.reduce((acc, c) => acc + Number(c.credits), 0);
            const totPoints = courses.reduce((acc, c) => acc + (Number(c.credits) * Number(c.points)), 0);
            const computedSgpa = totCredits > 0 ? (totPoints / totCredits) : s.sgpa;

            return {
              ...s,
              courses,
              credits: totCredits,
              sgpa: parseFloat(computedSgpa.toFixed(2))
            };
          }
          return s;
        });

        onUpdateCgpiData({ ...cgpiData, semesters: updatedSemesters });
        setNewCourse({ name: '', credits: 4, grade: 'A+', points: 9 });
        showToast(`Course added! Semester SGPA auto-recalculated.`, 'success');
      };

      const handleDeleteCourse = (courseId) => {
        const updatedSemesters = cgpiData.semesters.map(s => {
          if (s.id === selectedSemester.id) {
            const courses = (s.courses || []).filter(c => c.id !== courseId);
            const totCredits = courses.reduce((acc, c) => acc + Number(c.credits), 0);
            const totPoints = courses.reduce((acc, c) => acc + (Number(c.credits) * Number(c.points)), 0);
            const computedSgpa = totCredits > 0 ? (totPoints / totCredits) : s.sgpa;

            return {
              ...s,
              courses,
              credits: totCredits || s.credits,
              sgpa: totCredits > 0 ? parseFloat(computedSgpa.toFixed(2)) : s.sgpa
            };
          }
          return s;
        });

        onUpdateCgpiData({ ...cgpiData, semesters: updatedSemesters });
        showToast('Course removed.', 'info');
      };

      const handleComputeSgpaFromCourses = (semId) => {
        const targetSem = cgpiData.semesters.find(s => s.id === semId);
        if (!targetSem || !targetSem.courses || targetSem.courses.length === 0) {
          showToast('Add courses to this semester first!', 'warning');
          return;
        }

        const totCredits = targetSem.courses.reduce((acc, c) => acc + Number(c.credits), 0);
        const totPoints = targetSem.courses.reduce((acc, c) => acc + (Number(c.credits) * Number(c.points)), 0);
        const computedSgpa = totCredits > 0 ? parseFloat((totPoints / totCredits).toFixed(2)) : 0;

        const updated = cgpiData.semesters.map(s => {
          if (s.id === semId) {
            return {
              ...s,
              credits: totCredits,
              sgpa: computedSgpa,
              status: 'completed'
            };
          }
          return s;
        });

        onUpdateCgpiData({ ...cgpiData, semesters: updated });
        triggerConfetti();
        showToast(`Calculated SGPA: ${computedSgpa} for ${targetSem.name}! 🎉`, 'success');
      };

      const progressPercent = Math.min(100, (cgpiSummary.cgpiNum / 10) * 100);
      const degreeProgress = Math.min(100, (cgpiSummary.totalCredits / (cgpiData.totalDegreeCredits || 160)) * 100);

      return (
        <div className="space-y-6">
          
          {/* Module Header */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <div className="flex items-center gap-2">
                <span className="p-2 rounded-xl bg-amber-500/10 text-amber-500 font-bold">
                  <Icon name="award" className="w-5 h-5" />
                </span>
                <h2 className="text-xl font-extrabold tracking-tight">CGPI & SGPA Calculator</h2>
              </div>
              <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                Semester-wise credit weighting, university percentage conversions, and Target CGPI forecasting
              </p>
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={() => setShowGradingScale(!showGradingScale)}
                className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-slate-200 dark:border-dark-border bg-white dark:bg-dark-card text-xs font-semibold hover:bg-slate-50 dark:hover:bg-dark-cardHover transition-colors"
              >
                <Icon name="calculator" className="w-3.5 h-3.5 text-brand-500" />
                {showGradingScale ? "Hide Grade Scale" : "Grade Point Reference"}
              </button>
              <button
                onClick={handleAddSemester}
                className="flex items-center gap-1.5 px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold text-xs shadow-md hover:shadow-lg transition-all"
              >
                <Icon name="plus" className="w-4 h-4" /> Add Semester
              </button>
            </div>
          </div>

          {/* Collapsible Grade Scale Reference Card */}
          {showGradingScale && (
            <div className="p-5 rounded-2xl border border-amber-200 dark:border-amber-900/40 bg-amber-50/50 dark:bg-amber-950/20 shadow-sm animate-fade-in">
              <div className="flex items-center justify-between mb-3">
                <h4 className="text-xs font-bold uppercase tracking-wider text-amber-800 dark:text-amber-300 flex items-center gap-2">
                  <Icon name="award" className="w-4 h-4 text-amber-500" />
                  Standard 10-Point UGC / University Grade Point Scale
                </h4>
                <button onClick={() => setShowGradingScale(false)} className="text-xs text-slate-400 hover:text-slate-600">
                  <Icon name="x" className="w-4 h-4" />
                </button>
              </div>
              <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-2 text-center text-xs">
                {GRADE_OPTIONS.map(g => (
                  <div key={g.grade} className="p-2 rounded-xl bg-white dark:bg-dark-card border border-amber-200/50 dark:border-dark-border">
                    <span className="block font-black text-amber-600 dark:text-amber-400 text-sm">{g.grade}</span>
                    <span className="font-bold text-slate-700 dark:text-slate-200">{g.points} Pts</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* MAIN CGPI HIGHLIGHTS HERO CARD */}
          <div className="p-6 sm:p-8 rounded-3xl border border-slate-200 dark:border-dark-border bg-white dark:bg-dark-card shadow-md relative overflow-hidden">
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
              
              {/* Radial Score Gauge (Cols 1-4) */}
              <div className="lg:col-span-4 flex flex-col items-center justify-center text-center p-4 border-b lg:border-b-0 lg:border-r border-slate-100 dark:border-dark-border">
                <div className="relative w-44 h-44 flex items-center justify-center">
                  <svg className="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                    <circle
                      cx="50"
                      cy="50"
                      r="45"
                      className="stroke-slate-100 dark:stroke-dark-border"
                      strokeWidth="7"
                      fill="transparent"
                    />
                    <circle
                      cx="50"
                      cy="50"
                      r="45"
                      className="stroke-amber-500 transition-all duration-700 ease-out"
                      strokeWidth="7"
                      strokeDasharray="282.7"
                      strokeDashoffset={282.7 - (282.7 * progressPercent) / 100}
                      strokeLinecap="round"
                      fill="transparent"
                    />
                  </svg>
                  <div className="absolute flex flex-col items-center justify-center">
                    <span className="font-black text-4xl text-slate-900 dark:text-white tracking-tight">
                      {cgpiSummary.cgpi}
                    </span>
                    <span className="text-[11px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">
                      out of 10.0
                    </span>
                  </div>
                </div>

                <div className="mt-3 space-y-1">
                  <span className={`inline-block px-3 py-1 rounded-full text-xs font-extrabold ${
                    cgpiSummary.cgpiNum >= 8.5 ? 'bg-amber-100 dark:bg-amber-950/60 text-amber-700 dark:text-amber-300 border border-amber-300/40' :
                    cgpiSummary.cgpiNum >= 7.0 ? 'bg-emerald-100 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300' :
                    'bg-slate-100 dark:bg-dark-border text-slate-700 dark:text-slate-300'
                  }`}>
                    {cgpiSummary.classification}
                  </span>
                  <p className="text-[11px] text-slate-400">
                    Weighted across {cgpiSummary.completedSemestersCount} completed semester{cgpiSummary.completedSemestersCount !== 1 ? 's' : ''}
                  </p>
                </div>
              </div>

              {/* Details & Conversions (Cols 5-8) */}
              <div className="lg:col-span-5 space-y-4">
                <div>
                  <span className="text-xs font-bold uppercase tracking-wider text-slate-400">
                    Percentage Equivalent
                  </span>
                  <div className="flex items-baseline gap-2 mt-1">
                    <span className="text-3xl font-black text-slate-900 dark:text-white">
                      {cgpiSummary.percentage}%
                    </span>
                    <span className="text-xs text-slate-500">
                      via {formulas.find(f => f.id === cgpiData.conversionFormula)?.name}
                    </span>
                  </div>
                </div>

                {/* Formula Selector Pills */}
                <div>
                  <label className="text-[11px] font-semibold text-slate-400 block mb-1.5">
                    Conversion Formula Standard:
                  </label>
                  <div className="grid grid-cols-3 gap-1.5 p-1 rounded-xl bg-slate-100 dark:bg-dark-bg border border-slate-200 dark:border-dark-border">
                    {formulas.map(f => (
                      <button
                        key={f.id}
                        onClick={() => handleFormulaChange(f.id)}
                        className={`px-2 py-1.5 rounded-lg text-[11px] font-bold transition-all text-center ${
                          cgpiData.conversionFormula === f.id
                            ? 'bg-white dark:bg-dark-card text-brand-600 dark:text-white shadow-sm'
                            : 'text-slate-500 hover:text-slate-800 dark:hover:text-slate-200'
                        }`}
                        title={f.desc}
                      >
                        {f.name}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Degree Credits Bar */}
                <div className="space-y-1.5 pt-1">
                  <div className="flex justify-between items-center text-xs">
                    <span className="font-semibold text-slate-600 dark:text-slate-300">Degree Credits Progress</span>
                    <span className="font-bold text-slate-900 dark:text-slate-100">
                      {cgpiSummary.totalCredits} / {cgpiData.totalDegreeCredits || 160} Credits ({degreeProgress.toFixed(0)}%)
                    </span>
                  </div>
                  <div className="w-full h-2.5 rounded-full bg-slate-100 dark:bg-dark-border overflow-hidden">
                    <div
                      className="h-full rounded-full bg-gradient-to-r from-amber-500 via-brand-500 to-indigo-500 transition-all duration-500"
                      style={{ width: `${degreeProgress}%` }}
                    />
                  </div>
                  <div className="flex justify-between items-center text-[10px] text-slate-400">
                    <span>Earned: {cgpiSummary.totalCredits}</span>
                    <span>Remaining: {cgpiSummary.remainingCredits} credits</span>
                  </div>
                </div>
              </div>

              {/* Semester SGPA Trend Sparkline (Cols 9-12) */}
              <div className="lg:col-span-3 p-4 rounded-2xl bg-slate-50 dark:bg-dark-bg/60 border border-slate-100 dark:border-dark-border space-y-3">
                <div className="flex items-center justify-between">
                  <span className="text-[11px] font-bold uppercase tracking-wider text-slate-400">
                    SGPA Trend
                  </span>
                  <span className="text-[11px] font-semibold text-amber-500">
                    Peak: {Math.max(...cgpiData.semesters.map(s => Number(s.sgpa) || 0))}
                  </span>
                </div>

                {/* Visual Mini Bars */}
                <div className="flex items-end justify-between gap-1.5 h-24 pt-2 px-1">
                  {cgpiData.semesters.map((sem, idx) => {
                    const sgpaNum = Number(sem.sgpa) || 0;
                    const heightPercent = Math.min(100, Math.max(15, (sgpaNum / 10) * 100));
                    const isSelected = sem.id === selectedSemester?.id;
                    return (
                      <div
                        key={sem.id}
                        onClick={() => setSelectedSemId(sem.id)}
                        className="flex-1 flex flex-col items-center gap-1 group cursor-pointer"
                        title={`${sem.name}: ${sgpaNum} SGPA (${sem.credits} credits)`}
                      >
                        <span className="text-[9px] font-mono font-bold text-slate-400 group-hover:text-amber-500 transition-colors">
                          {sgpaNum}
                        </span>
                        <div className="w-full bg-slate-200 dark:bg-dark-border rounded-t-lg overflow-hidden flex items-end h-16">
                          <div
                            className={`w-full rounded-t-lg transition-all duration-500 ${
                              isSelected
                                ? 'bg-amber-500 shadow-md shadow-amber-500/30'
                                : sgpaNum >= 8.5
                                ? 'bg-amber-400 dark:bg-amber-500/80 group-hover:bg-amber-500'
                                : 'bg-brand-500 dark:bg-brand-600 group-hover:bg-brand-400'
                            }`}
                            style={{ height: `${heightPercent}%` }}
                          />
                        </div>
                        <span className={`text-[10px] font-bold ${isSelected ? 'text-amber-500' : 'text-slate-400'}`}>
                          S{idx + 1}
                        </span>
                      </div>
                    );
                  })}
                </div>
              </div>

            </div>
          </div>

          {/* TARGET CGPI PLANNER & FORECASTER ("TARGET BHAI") */}
          <div className="p-6 rounded-3xl border border-slate-200 dark:border-dark-border bg-gradient-to-br from-amber-50/40 via-white to-indigo-50/30 dark:from-dark-card dark:via-dark-card dark:to-dark-cardHover shadow-sm space-y-4">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <div className="flex items-center gap-2">
                  <Icon name="sparkles" className="w-4 h-4 text-amber-500" />
                  <h3 className="font-extrabold text-base text-slate-900 dark:text-slate-100">
                    Target CGPI Forecaster ("What-If Predictor")
                  </h3>
                </div>
                <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                  Determine the exact average SGPA required in your remaining semesters to hit your graduation goal
                </p>
              </div>

              {/* Target Slider & Input Controls */}
              <div className="flex items-center gap-3">
                <div className="flex items-center gap-2">
                  <label className="text-xs font-semibold text-slate-500">Target:</label>
                  <input
                    type="number"
                    step="0.05"
                    min="5.0"
                    max="10.0"
                    value={cgpiData.targetCgpi || 8.5}
                    onChange={(e) => handleTargetCgpiChange(e.target.value)}
                    className="w-20 px-2.5 py-1 rounded-xl border border-slate-200 dark:border-dark-border bg-white dark:bg-dark-bg text-sm font-bold text-amber-600 dark:text-amber-400 focus:outline-none focus:ring-2 focus:ring-amber-500"
                  />
                </div>
                <div className="flex items-center gap-2">
                  <label className="text-xs font-semibold text-slate-500">Degree Credits:</label>
                  <input
                    type="number"
                    step="1"
                    min="100"
                    max="250"
                    value={cgpiData.totalDegreeCredits || 160}
                    onChange={(e) => handleTotalCreditsChange(e.target.value)}
                    className="w-20 px-2.5 py-1 rounded-xl border border-slate-200 dark:border-dark-border bg-white dark:bg-dark-bg text-sm font-bold text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500"
                  />
                </div>
              </div>
            </div>

            {/* Forecaster Result Card */}
            <div className={`p-4 rounded-2xl border text-xs font-medium flex flex-col md:flex-row md:items-center justify-between gap-3 ${
              cgpiSummary.cgpiNum >= cgpiData.targetCgpi
                ? 'bg-emerald-50 dark:bg-emerald-950/40 border-emerald-200 dark:border-emerald-900 text-emerald-800 dark:text-emerald-300'
                : cgpiSummary.requiredSgpaNum <= 10.0 && cgpiSummary.requiredSgpaNum > 0
                ? 'bg-amber-50 dark:bg-amber-950/40 border-amber-200 dark:border-amber-900 text-amber-900 dark:text-amber-200'

    // --- COMPONENT: SUBJECT ATTENDANCE CARD ---
    function SubjectAttendanceCard({ subject, onLogPresent, onLogAbsent, onUndo, onEdit, onDelete }) {
      const attended = Number(subject.attended) || 0;
      const total = Number(subject.total) || 0;
      const minReq = Number(subject.minPercent) || 75;

      const currentPercent = total > 0 ? (attended / total) * 100 : 100;
      const isSafe = currentPercent >= minReq;

      // Smart Calculation Formula:
      // Case 1: Attendance is Safe (>= minReq) -> How many classes can you bunk?
      // Formula: (attended) / (total + X) >= minReq/100  =>  X <= (attended / (minReq/100)) - total
      // X = floor(attended / (minReq / 100) - total)
      let smartText = '';
      let smartBadge = null;

      if (total === 0) {
        smartText = "No classes recorded yet. Log your first lecture attendance!";
        smartBadge = { label: "Fresh", color: "bg-slate-100 text-slate-600 dark:bg-dark-border dark:text-slate-400" };
      } else if (isSafe) {
        const reqDecimal = minReq / 100;
        const bunkableClasses = Math.floor((attended / reqDecimal) - total + 1e-9);

        if (bunkableClasses > 0) {
          smartText = `🎉 You can bunk ${bunkableClasses} more class${bunkableClasses > 1 ? 'es' : ''} and still maintain ${minReq}%!`;
          smartBadge = { label: `Bunkable: ${bunkableClasses}`, color: "bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300" };
        } else {
          smartText = `⚠️ On the edge! Missing the next lecture will drop you below ${minReq}%.`;
          smartBadge = { label: "Edge Safe", color: "bg-amber-100 text-amber-700 dark:bg-amber-950 dark:text-amber-300" };
        }
      } else {
        // Case 2: Attendance is in Shortage (< minReq) -> How many consecutive classes to attend?
        // Formula: (attended + Y) / (total + Y) >= minReq/100
        // Y * (1 - minReq/100) >= (minReq/100 * total) - attended
        // Y = ceil(( (minReq/100 * total) - attended ) / (1 - minReq/100))
        const reqDecimal = minReq / 100;
        if (reqDecimal >= 1) {
          smartText = `🚨 100% required. Cannot drop any classes.`;
        } else {
          const needed = Math.ceil(((reqDecimal * total) - attended) / (1 - reqDecimal) - 1e-9);
          smartText = `🚨 Attendance Shortage! You need to attend ${needed} more consecutive class${needed > 1 ? 'es' : ''} to reach ${minReq}%.`;
          smartBadge = { label: `Need +${needed}`, color: "bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300" };
        }
      }

      return (
        <div className="p-5 rounded-2xl border border-slate-200 dark:border-dark-border bg-white dark:bg-dark-card shadow-sm hover:border-slate-300 dark:hover:border-slate-700 transition-all">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            
            {/* Subject Title & Code */}
            <div>
              <div className="flex items-center gap-2">
                <span className="text-xs font-mono font-semibold px-2 py-0.5 rounded bg-slate-100 dark:bg-dark-border text-slate-600 dark:text-slate-300">
                  {subject.code || 'SUB'}
                </span>
                <h3 className="font-bold text-base text-slate-900 dark:text-slate-100">
                  {subject.name}
                </h3>
                {smartBadge && (
                  <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${smartBadge.color}`}>
                    {smartBadge.label}
                  </span>
                )}
              </div>

              <div className="flex items-center gap-3 mt-1 text-xs text-slate-500 dark:text-slate-400">
                <span>Held: <strong className="text-slate-700 dark:text-slate-200">{total}</strong></span>
                <span>•</span>
                <span>Attended: <strong className="text-slate-700 dark:text-slate-200">{attended}</strong></span>
                <span>•</span>
                <span>Target: <strong>{minReq}%</strong></span>
              </div>
            </div>

            {/* Attendance Percentage & Action Buttons */}
            <div className="flex items-center justify-between sm:justify-end gap-3">
              <div className="text-right">
                <span className={`text-2xl font-black ${
                  isSafe ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'
                }`}>
                  {total > 0 ? currentPercent.toFixed(1) : '100'}%
                </span>
              </div>

              {/* Quick Logging Buttons */}
              <div className="flex items-center gap-1.5">
                <button
                  onClick={onLogPresent}
                  title="Mark Present (+1 Attended, +1 Total)"
                  className="flex items-center gap-1 px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-sm hover:shadow transition-all"
                >
                  <Icon name="plus" className="w-3.5 h-3.5" /> Present
                </button>
                <button
                  onClick={onLogAbsent}
                  title="Mark Absent (+1 Total)"
                  className="flex items-center gap-1 px-3 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold shadow-sm hover:shadow transition-all"
                >
                  <Icon name="plus" className="w-3.5 h-3.5" /> Absent
                </button>
                {subject.history && subject.history.length > 0 && (
                  <button
                    onClick={onUndo}
                    title="Undo last log"
                    className="p-1.5 rounded-xl border border-slate-200 dark:border-dark-border text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-dark-cardHover transition-colors"
                  >
                    <Icon name="undo" className="w-3.5 h-3.5" />
                  </button>
                )}
                <button
                  onClick={onEdit}
                  title="Edit Subject"
                  className="p-1.5 rounded-xl border border-slate-200 dark:border-dark-border text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-dark-cardHover transition-colors"
                >
                  <Icon name="edit" className="w-3.5 h-3.5" />
                </button>
                <button
                  onClick={onDelete}
                  title="Delete Subject"
                  className="p-1.5 rounded-xl border border-slate-200 dark:border-dark-border text-slate-500 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/30 transition-colors"
                >
                  <Icon name="trash" className="w-3.5 h-3.5" />
                </button>
              </div>

            </div>

          </div>

          {/* Color-Coded Visual Progress Bar with Threshold Marker */}
          <div className="relative mt-4 w-full h-3 rounded-full bg-slate-100 dark:bg-dark-border overflow-hidden">
            <div
              className={`h-full rounded-full transition-all duration-300 ${
                isSafe
                  ? 'bg-gradient-to-r from-emerald-500 to-teal-400'
                  : 'bg-gradient-to-r from-rose-500 to-amber-500'
              }`}
              style={{ width: `${Math.min(100, Math.max(0, currentPercent))}%` }}
            />
            {/* Indicator line for Required % */}
            <div
              className="absolute top-0 bottom-0 w-0.5 bg-slate-900/60 dark:bg-white/80 z-10"
              style={{ left: `${minReq}%` }}
              title={`Target: ${minReq}%`}
            />
          </div>

          {/* Smart Calculation Text Bar */}
          <div className={`mt-3 px-3.5 py-2 rounded-xl text-xs font-medium flex items-center justify-between ${
            isSafe
              ? 'bg-emerald-50 dark:bg-emerald-950/40 text-emerald-800 dark:text-emerald-300 border border-emerald-200/50 dark:border-emerald-800/40'
              : 'bg-rose-50 dark:bg-rose-950/40 text-rose-800 dark:text-rose-300 border border-rose-200/50 dark:border-rose-800/40'
          }`}>
            <span>{smartText}</span>
            <span className="text-[11px] opacity-75 font-mono">Req: {minReq}%</span>
          </div>
        </div>
      );
    }

    // --- COMPONENT: TASK MANAGER ---
    function TaskManager({ tasks, subjects, onToggleComplete, onEditTask, onDeleteTask, onAddTask }) {
      const [filter, setFilter] = useState('all'); // all | active | completed
      const [priorityFilter, setPriorityFilter] = useState('all'); // all | High | Medium | Low
      const [search, setSearch] = useState('');

      // Collapsible Add-Task Form state
      const [isFormOpen, setIsFormOpen] = useState(false);
      const [newTitle, setNewTitle] = useState('');
      const [newSubject, setNewSubject] = useState(subjects[0]?.name || '');
      const [newDueDate, setNewDueDate] = useState(() => new Date().toISOString().slice(0, 10));
      const [newPriority, setNewPriority] = useState('Medium');
      const [newNotes, setNewNotes] = useState('');

      const handleFormSubmit = (e) => {
        e.preventDefault();
        if (!newTitle.trim()) return;
        if (onAddTask) {
          onAddTask({
            id: `task-${Date.now()}`,
            title: newTitle.trim(),
            subject: newSubject.trim() || (subjects[0]?.name || 'General'),
            dueDate: newDueDate,
            priority: newPriority,
            notes: newNotes.trim(),
            completed: false
          });
        }
        setNewTitle('');
        setNewNotes('');
        setIsFormOpen(false);
      };

      const filteredTasks = useMemo(() => {
        return tasks.filter(task => {
          if (filter === 'active' && task.completed) return false;
          if (filter === 'completed' && !task.completed) return false;
          if (priorityFilter !== 'all' && task.priority !== priorityFilter) return false;
          if (search.trim() && !task.title.toLowerCase().includes(search.toLowerCase()) && !task.subject.toLowerCase().includes(search.toLowerCase())) return false;
          return true;
        });
      }, [tasks, filter, priorityFilter, search]);

      const pendingCount = tasks.filter(t => !t.completed).length;
      const completedCount = tasks.filter(t => t.completed).length;

      return (
        <div className="space-y-5">
          
          {/* Header with task count + "Add Task" button */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-2 border-b border-slate-200 dark:border-dark-border">
            <div>
              <h2 className="text-xl font-extrabold tracking-tight text-slate-900 dark:text-white flex items-center gap-2">

          <div className="p-4 rounded-2xl border border-slate-200 dark:border-dark-border bg-white dark:bg-dark-card flex flex-col md:flex-row md:items-center justify-between gap-3 shadow-sm">
            <div className="flex items-center gap-1.5 overflow-x-auto pb-1 md:pb-0">
              {[

              <div className="h-4 w-px bg-slate-200 dark:bg-dark-border mx-1" />

              {/* Priority dropdown */}
              <select

              >
                <option value="all">All Priorities</option>
                <option value="High">🔴 High Priority</option>
                <option value="Medium">🟡 Medium Priority</option>
                <option value="Low">🟢 Low Priority</option>

            {/* Search Box */}
            <div className="relative min-w-[220px]">
              <Icon name="search" className="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" />
              <input
                type="text"
                placeholder="Search tasks..."
                value={search}
                onChange={(e) => setSearch(e.target.value)}
                className="w-full pl-9 pr-3 py-1.5 rounded-xl border border-slate-200 dark:border-dark-border bg-slate-50 dark:bg-dark-bg text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500"
              />

          {/* Tasks List */}
          <div className="space-y-2.5">

                <p className="text-sm font-semibold">No tasks found</p>
                <p className="text-xs text-slate-500 mt-1">Try resetting your filters or add a new task.</p>

            ) : (
              filteredTasks.map(task => {
                const diff = getDaysDiff(task.dueDate);
                return (
                  <div
                    key={task.id}
                    className={`p-4 rounded-xl border transition-all flex items-start justify-between gap-3 ${
                      task.completed
                        ? 'border-slate-200 dark:border-dark-border/50 bg-slate-50/50 dark:bg-dark-card/40 opacity-70'
                        : 'border-slate-200 dark:border-dark-border bg-white dark:bg-dark-card shadow-sm hover:border-indigo-500/40'
                    }`}
                  >
                    <div className="flex items-start gap-3 min-w-0">
                      {/* Circle Checkbox */}
                      <button
                        type="button"
                        onClick={() => onToggleComplete(task.id)}
                        className={`w-5 h-5 rounded-full border-2 flex items-center justify-center flex-shrink-0 mt-0.5 transition-all ${
                          task.completed
                            ? 'bg-indigo-600 border-indigo-600 text-white'
                            : 'border-slate-300 dark:border-slate-600 hover:border-indigo-600 dark:hover:border-indigo-400 bg-white dark:bg-dark-bg'
                        }`}
                        title={task.completed ? "Mark pending" : "Mark completed"}
                      >
                        {task.completed && (
                          <svg className="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                            <polyline points="20 6 9 17 4 12" />
                          </svg>
                        )}
                      </button>

                      <div className="space-y-1 min-w-0">
                        <div className="flex flex-wrap items-center gap-2">
                          <h4 className={`text-sm font-semibold ${
                            task.completed ? 'line-through text-slate-400 dark:text-slate-500' : 'text-slate-800 dark:text-slate-100'
                          }`}>
                            {task.title}
                          </h4>
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                            task.priority === 'High' ? 'bg-rose-100 dark:bg-rose-950 text-rose-600 dark:text-rose-400' :
                            task.priority === 'Medium' ? 'bg-amber-100 dark:bg-amber-950 text-amber-600 dark:text-amber-400' :
                            'bg-emerald-100 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-400'
                          }`}>
                            {task.priority}
                          </span>
                          <span className="text-[10px] font-medium px-2 py-0.5 rounded bg-slate-100 dark:bg-dark-border text-slate-600 dark:text-slate-300">
                            {task.subject}
                          </span>
                        </div>

                        {task.notes && (
                          <p className="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">
                            {task.notes}
                          </p>
                        )}

                        <div className="flex items-center gap-3 text-[11px] text-slate-400">
                          <span className="flex items-center gap-1">
                            <Icon name="calendar" className="w-3 h-3" /> Due {task.dueDate}
                          </span>
                          {!task.completed && (
                            <span className={`font-semibold ${
                              diff < 0 ? 'text-rose-500' : diff === 0 ? 'text-amber-500' : 'text-slate-500'
                            }`}>
                              ({diff < 0 ? 'Overdue!' : diff === 0 ? 'Due Today' : `In ${diff} days`})
                            </span>

                    {/* Actions */}
                    <div className="flex items-center gap-1 flex-shrink-0">

                        title="Edit Task"
                      >
                        <Icon name="edit" className="w-3.5 h-3.5" />
                      </button>
                      <button
                        onClick={() => onDeleteTask(task.id)}
                        className="p-1.5 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/30 transition-colors"
                        title="Delete Task"
                      >
                        <Icon name="trash" className="w-3.5 h-3.5" />

                  </div>
                );
              })
            )}
          </div>
        </div>
      );
    }

    // --- COMPONENT: WEEKLY TIMETABLE MODULE ---
    function TimetableModule({ timetable, subjects, onUpdateTimetable, showToast }) {
      const days = TIMETABLE_DAYS;
      const [selectedDay, setSelectedDay] = useState(() => {
        const todayDay = new Date().toLocaleDateString('en-US', { weekday: 'long' });
        return days.includes(todayDay) ? todayDay : 'Monday';
      });

      const [isAddSlotOpen, setIsAddSlotOpen] = useState(false);
      const [isParsingPdf, setIsParsingPdf] = useState(false);
      const [pdfError, setPdfError] = useState('');
      const [importPreview, setImportPreview] = useState(null);
      const [slotForm, setSlotForm] = useState({
        time: '09:00 - 10:00 AM',
        subject: subjects[0]?.name || '',
        room: 'LH-101',
        type: 'Lecture'
      });

      const daySlots = timetable[selectedDay] || [];

      const handleAddSlot = (e) => {
        e.preventDefault();
        const updated = {
          ...timetable,
          [selectedDay]: [...daySlots, slotForm]
        };
        onUpdateTimetable(updated);
        showToast('Timetable slot added.', 'success');
        setIsAddSlotOpen(false);
      };

      const handleRemoveSlot = (index) => {
        const updatedSlots = daySlots.filter((_, i) => i !== index);
        onUpdateTimetable({
          ...timetable,
          [selectedDay]: updatedSlots
        });
        showToast('Timetable slot removed.', 'info');
      };

      const handlePdfUpload = async (e) => {
        const file = e.target.files?.[0];
        e.target.value = '';
        if (!file) return;
        setPdfError('');
        setImportPreview(null);
        if (!file.name.toLowerCase().endsWith('.pdf') || file.size > 20 * 1024 * 1024) {
          setPdfError('Choose a PDF file smaller than 20 MB.');
          return;
        }
        if (!window.pdfjsLib) {
          setPdfError('The PDF reader could not load. Check your internet connection and try again.');
          return;
        }

        setIsParsingPdf(true);
        let pdf;
        try {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
          pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
          if (pdf.numPages > 50) {
            throw new Error('This PDF has more than 50 pages. Please upload just the timetable pages.');
          }
          const pages = [];
          for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
            const page = await pdf.getPage(pageNumber);
            const content = await page.getTextContent();
            pages.push(content.items.filter(item => typeof item.str === 'string'));
          }

          const result = parseTimetablePdfPages(pages);
          if (!result.foundRows) {
            throw new Error('No timetable rows were detected. This PDF may be scanned or use a layout the importer cannot recognize. Try a text-based PDF with weekday and time labels.');
          }
          setImportPreview({ schedule: result.schedule, foundRows: result.foundRows, fileName: file.name });
        } catch (error) {
          setPdfError(error.message || 'Could not read this PDF. Please try another timetable file.');
        } finally {
          if (pdf) {
            try {
              await pdf.destroy();
            } catch (cleanupError) {
              console.error('Could not close PDF reader cleanly.', cleanupError);
            }
          }
          setIsParsingPdf(false);
        }
      };

      const applyPdfSchedule = () => {
        if (!importPreview) return;
        onUpdateTimetable(importPreview.schedule);
        setImportPreview(null);
        showToast(`Imported ${Object.values(importPreview.schedule).reduce((total, slots) => total + slots.length, 0)} classes from the PDF.`, 'success');
      };

      return (
        <div className="space-y-5">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-xl font-extrabold tracking-tight">Weekly Class & Study Schedule</h2>
              <p className="text-xs text-slate-500 dark:text-slate-400">Import your college timetable PDF or add classes manually</p>
            </div>
            <div className="flex flex-wrap items-center gap-2">
              <label className={`flex items-center gap-2 px-4 py-2 rounded-xl border border-slate-200 dark:border-dark-border bg-white dark:bg-dark-card text-xs font-bold cursor-pointer hover:bg-slate-50 dark:hover:bg-dark-cardHover ${isParsingPdf ? 'opacity-60 pointer-events-none' : ''}`}>
                <Icon name="upload" className="w-4 h-4 text-indigo-500" />
                {isParsingPdf ? 'Analyzing PDF…' : 'Upload Timetable PDF'}
                <input type="file" accept="application/pdf,.pdf" onChange={handlePdfUpload} disabled={isParsingPdf} className="hidden" />
              </label>
              <button
                onClick={() => setIsAddSlotOpen(true)}
                className="flex items-center gap-2 px-4 py-2 rounded-xl bg-brand-600 text-white text-xs font-bold shadow-md hover:bg-brand-700 transition-all"
              >
                <Icon name="plus" className="w-4 h-4" /> Add Timetable Slot
              </button>
            </div>
          </div>

          {pdfError && (
            <div role="alert" className="p-3 rounded-xl border border-rose-200 dark:border-rose-900 bg-rose-50 dark:bg-rose-950/30 text-xs text-rose-700 dark:text-rose-300">
              {pdfError}
            </div>
          )}
          {importPreview && (
            <section className="p-4 sm:p-5 rounded-2xl border border-indigo-200 dark:border-indigo-900 bg-indigo-50/70 dark:bg-indigo-950/20 space-y-4">
              <div className="flex flex-col sm:flex-row sm:items-start justify-between gap-3">
                <div>
                  <h3 className="font-bold text-sm">Review extracted timetable</h3>
                  <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                    {importPreview.fileName} · {importPreview.foundRows} classes detected. Review the day assignments before importing.
                  </p>
                  <p className="text-[11px] text-slate-500 dark:text-slate-400 mt-1">Importing replaces the current weekly schedule. PDF contents are processed in this browser.</p>
                </div>
                <div className="flex items-center gap-2">
                  <button onClick={() => setImportPreview(null)} className="px-3 py-2 rounded-lg border border-slate-200 dark:border-dark-border text-xs font-semibold">Cancel</button>
                  <button onClick={applyPdfSchedule} className="px-3 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold">Import Schedule</button>
                </div>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                {days.filter(day => importPreview.schedule[day]?.length).map(day => (
                  <div key={day} className="rounded-xl border border-indigo-100 dark:border-indigo-900/70 bg-white dark:bg-dark-card p-3">
                    <h4 className="text-xs font-bold text-indigo-700 dark:text-indigo-300 mb-2">{day}</h4>
                    <ul className="space-y-1.5">
                      {importPreview.schedule[day].map((slot, index) => (
                        <li key={`${day}-${index}`} className="text-[11px] text-slate-700 dark:text-slate-300">
                          <span className="font-mono text-slate-500">{slot.time}</span> · {slot.subject}{slot.room ? ` (${slot.room})` : ''}
                        </li>
                      ))}
                    </ul>
                  </div>
                ))}
              </div>
            </section>
          )}

          {/* Days Pill Selector */}
          <div className="flex items-center gap-2 overflow-x-auto pb-2">
            {days.map(d => {
              const count = (timetable[d] || []).length;
              return (
                <button
                  key={d}
                  onClick={() => setSelectedDay(d)}
                  className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 whitespace-nowrap ${
                    selectedDay === d
                      ? 'bg-brand-600 text-white shadow-md'
                      : 'bg-white dark:bg-dark-card border border-slate-200 dark:border-dark-border text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-dark-cardHover'
                  }`}
                >
                  <span>{d}</span>
                  <span className={`text-[10px] px-1.5 py-0.2 rounded-full ${
                    selectedDay === d ? 'bg-white/20 text-white' : 'bg-slate-100 dark:bg-dark-border text-slate-500'
                  }`}>
                    {count}
                  </span>
                </button>
              );
            })}
          </div>

          {/* Schedule Slots Card */}
          <div className="p-6 rounded-2xl border border-slate-200 dark:border-dark-border bg-white dark:bg-dark-card shadow-sm">
            <div className="flex items-center justify-between mb-4 pb-3 border-b border-slate-100 dark:border-dark-border">
              <h3 className="font-bold text-base flex items-center gap-2">
                <Icon name="calendar" className="w-4 h-4 text-brand-500" />
                Schedule for {selectedDay}
              </h3>
              <span className="text-xs text-slate-500">
                {daySlots.length} slot{daySlots.length !== 1 ? 's' : ''} planned
              </span>
            </div>

            {daySlots.length === 0 ? (
              <div className="text-center py-10">
                <Icon name="sparkles" className="w-8 h-8 text-slate-400 mx-auto mb-2" />
                <p className="text-sm font-medium text-slate-600 dark:text-slate-400">No classes scheduled on {selectedDay}!</p>
                <p className="text-xs text-slate-400 mt-1">Use this free time for revision, hackathons, or relaxation.</p>
              </div>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                {daySlots.map((slot, idx) => (
                  <div key={idx} className="p-4 rounded-xl border border-slate-100 dark:border-dark-border/80 bg-slate-50/70 dark:bg-dark-cardHover/60 relative group space-y-2">
                    <button
                      onClick={() => handleRemoveSlot(idx)}
                      title="Remove Slot"
                      className="absolute top-3 right-3 p-1 rounded-lg text-slate-400 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/40 opacity-0 group-hover:opacity-100 transition-opacity"
                    >
                      <Icon name="x" className="w-3.5 h-3.5" />
                    </button>

                    <div className="flex items-center gap-2">
                      <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${
                        slot.type === 'Lab' ? 'bg-amber-100 dark:bg-amber-950 text-amber-700 dark:text-amber-300' :
                        slot.type === 'Self Study' ? 'bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300' :
                        'bg-brand-100 dark:bg-brand-950 text-brand-700 dark:text-brand-300'
                      }`}>
                        {slot.type}
                      </span>
                      <span className="text-xs font-mono font-medium text-slate-500">
                        {slot.time}
                      </span>
                    </div>

                    <h4 className="font-semibold text-sm line-clamp-1">{slot.subject}</h4>

                    <div className="flex items-center gap-1.5 text-xs text-slate-500 dark:text-slate-400">
                      <Icon name="mapPin" className="w-3 h-3" />
                      <span>{slot.room}</span>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Add Slot Modal */}
          {isAddSlotOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
              <div className="w-full max-w-md p-6 rounded-2xl bg-white dark:bg-dark-card border border-slate-200 dark:border-dark-border shadow-2xl">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="font-bold text-base">Add Slot for {selectedDay}</h3>
                  <button onClick={() => setIsAddSlotOpen(false)} className="p-1 rounded-lg text-slate-400 hover:text-slate-600">
