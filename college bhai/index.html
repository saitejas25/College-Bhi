    // --- COMPONENT: POMODORO MODULE ---
    function PomodoroModule({ stats, subjects, onSessionComplete }) {
      const [mode, setMode] = useState('focus'); // focus (25) | short (5) | long (15)
      const durations = { focus: 25 * 60, short: 5 * 60, long: 15 * 60 };
      const [timeLeft, setTimeLeft] = useState(durations.focus);
      const [isRunning, setIsRunning] = useState(false);
      const [activeSubject, setActiveSubject] = useState(subjects[0]?.name || 'General Focus');
      const [soundEnabled, setSoundEnabled] = useState(true);

      useEffect(() => {
        setTimeLeft(durations[mode]);
        setIsRunning(false);
      }, [mode]);

      useEffect(() => {
        let interval = null;
        if (isRunning && timeLeft > 0) {
          interval = setInterval(() => {
            setTimeLeft(prev => prev - 1);
          }, 1000);
        } else if (isRunning && timeLeft === 0) {
          setIsRunning(false);
          if (soundEnabled) playZenChime();
          if (mode === 'focus') {
            onSessionComplete();
          }
        }
        return () => clearInterval(interval);
      }, [isRunning, timeLeft, mode, soundEnabled]);

      const formatTime = (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      };

      const totalTime = durations[mode];
      const progress = ((totalTime - timeLeft) / totalTime) * 100;

      return (
        <div className="max-w-2xl mx-auto space-y-6">
          <div className="text-center space-y-1">
            <h2 className="text-2xl font-extrabold tracking-tight">Pomodoro Study Engine</h2>
            <p className="text-xs text-slate-500 dark:text-slate-400">
              Science-backed 25m Focus / 5m Break rhythm with auditory completion bell
            </p>
          </div>

          <div className="p-8 rounded-3xl border border-slate-200 dark:border-dark-border bg-white dark:bg-dark-card shadow-lg text-center space-y-6">
            
            {/* Mode Switcher */}
            <div className="inline-flex p-1.5 rounded-2xl bg-slate-100 dark:bg-dark-bg border border-slate-200 dark:border-dark-border">
              {[
                { id: 'focus', label: 'Focus (25m)' },
                { id: 'short', label: 'Short Break (5m)' },
                { id: 'long', label: 'Long Break (15m)' },
              ].map(m => (
                <button
                  key={m.id}
                  onClick={() => setMode(m.id)}
                  className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                    mode === m.id
                      ? 'bg-brand-600 text-white shadow-md'
                      : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                  }`}
                >
                  {m.label}
                </button>
              ))}
            </div>

            {/* Subject Selector for Focus Mode */}
            {mode === 'focus' && (
              <div className="max-w-xs mx-auto">
                <label className="text-[11px] font-semibold text-slate-400 block mb-1">Target Subject</label>
                <select
                  value={activeSubject}
                  onChange={e => setActiveSubject(e.target.value)}
                  className="w-full px-3 py-1.5 rounded-xl border border-slate-200 dark:border-dark-border bg-slate-50 dark:bg-dark-bg text-xs font-semibold text-slate-700 dark:text-slate-300"
                >
                  <option value="General Focus">⚡ General Focus</option>
                  {subjects.map(s => (
                    <option key={s.id} value={s.name}>{s.name}</option>
                  ))}
                </select>
              </div>
            )}

            {/* Big Countdown Timer Circle */}
            <div className="relative w-64 h-64 mx-auto flex items-center justify-center">
              <svg className="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                <circle
                  cx="50"
                  cy="50"
                  r="45"
                  className="stroke-slate-100 dark:stroke-dark-border"
                  strokeWidth="6"
                  fill="transparent"
                />
                <circle
                  cx="50"
                  cy="50"
                  r="45"
                  className="stroke-brand-500 transition-all duration-300"
                  strokeWidth="6"
                  strokeDasharray="282.7"
                  strokeDashoffset={282.7 - (282.7 * progress) / 100}
                  strokeLinecap="round"
                  fill="transparent"
                />
              </svg>

              <div className="absolute flex flex-col items-center justify-center">
                <span className="font-mono text-5xl font-black tracking-tight text-slate-900 dark:text-white">
                  {formatTime(timeLeft)}
                </span>
                <span className="text-xs uppercase font-bold tracking-widest text-brand-600 dark:text-brand-400 mt-1">
                  {mode === 'focus' ? 'Deep Work' : 'Rest & Recharge'}
                </span>
              </div>
            </div>

            {/* Controls */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={() => setTimeLeft(durations[mode])}
                title="Reset timer"
                className="p-3 rounded-2xl border border-slate-200 dark:border-dark-border bg-slate-50 dark:bg-dark-bg hover:bg-slate-100 dark:hover:bg-dark-border text-slate-600 dark:text-slate-300 transition-all"
              >
                <Icon name="rotateCcw" className="w-5 h-5" />
              </button>

              <button
                onClick={() => setIsRunning(!isRunning)}
                className={`px-8 py-3.5 rounded-2xl text-white font-extrabold text-sm flex items-center gap-2 shadow-lg transition-all transform active:scale-95 ${
                  isRunning
                    ? 'bg-amber-600 hover:bg-amber-700 shadow-amber-500/25'
                    : 'bg-brand-600 hover:bg-brand-700 shadow-brand-500/30'
                }`}
              >
                <Icon name={isRunning ? "pause" : "play"} className="w-5 h-5" />
                {isRunning ? "Pause Session" : "Start Focus"}
              </button>

              <button
                onClick={() => {
                  setTimeLeft(0);
                  setIsRunning(false);
                }}
                title="Skip to next phase"
                className="p-3 rounded-2xl border border-slate-200 dark:border-dark-border bg-slate-50 dark:bg-dark-bg hover:bg-slate-100 dark:hover:bg-dark-border text-slate-600 dark:text-slate-300 transition-all"
              >
                <Icon name="skipForward" className="w-5 h-5" />
              </button>

              <button
                onClick={() => setSoundEnabled(!soundEnabled)}
                title={soundEnabled ? "Sound enabled" : "Sound muted"}
                className="p-3 rounded-2xl border border-slate-200 dark:border-dark-border bg-slate-50 dark:bg-dark-bg hover:bg-slate-100 dark:hover:bg-dark-border text-slate-600 dark:text-slate-300 transition-all"
              >
                <Icon name={soundEnabled ? "volume2" : "volumeX"} className="w-5 h-5" />
              </button>
            </div>

            {/* Daily Stats Footer */}
            <div className="pt-4 border-t border-slate-100 dark:border-dark-border flex items-center justify-around text-xs text-slate-500">
              <div>
                <span className="block font-bold text-slate-900 dark:text-slate-100 text-sm">{stats.completedToday}</span>
                <span>Sessions Completed</span>
              </div>
              <div className="h-6 w-px bg-slate-200 dark:bg-dark-border" />
              <div>
                <span className="block font-bold text-slate-900 dark:text-slate-100 text-sm">{stats.totalMinutes} min</span>
                <span>Deep Work Today</span>
              </div>
              <div className="h-6 w-px bg-slate-200 dark:bg-dark-border" />
              <div>
                <span className="block font-bold text-slate-900 dark:text-slate-100 text-sm">
                  {Math.round((stats.completedToday / (stats.targetSessions || 4)) * 100)}%
                </span>
                <span>Daily Goal</span>
              </div>
            </div>

          </div>
        </div>
      );
    }

    // --- COMPONENT: EVENTS & HACKATHON MODULE ---
    function EventsModule({ events, onImportEvents, onToggleRsvp, onEditEvent, onDeleteEvent }) {
      const [categoryFilter, setCategoryFilter] = useState('all');
      const [rsvpFilter, setRsvpFilter] = useState('all'); // all | going | interested
      const [searchQuery, setSearchQuery] = useState('');
      const [isParsingPdf, setIsParsingPdf] = useState(false);
      const [pdfError, setPdfError] = useState('');
      const [importPreview, setImportPreview] = useState(null);

      const categories = ['all', ...EVENT_CATEGORIES];

      const handleCalendarPdfUpload = async (e) => {
        const file = e.target.files?.[0];
        e.target.value = '';
        if (!file) return;
        setPdfError('');
        setImportPreview(null);
        if (!file.name.toLowerCase().endsWith('.pdf') || file.size > 20 * 1024 * 1024) {
          setPdfError('Choose a PDF calendar smaller than 20 MB.');
          return;
        }
        if (!window.pdfjsLib) {
          setPdfError('The PDF reader could not load. Check your internet connection and try again.');
          return;
        }

        setIsParsingPdf(true);
        let pdf;
        try {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
          pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
          if (pdf.numPages > 50) {
            throw new Error('This PDF has more than 50 pages. Upload only the pages containing the event calendar.');
          }
          const pages = [];
          for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
            const page = await pdf.getPage(pageNumber);
            const content = await page.getTextContent();
            pages.push(content.items.filter(item => typeof item.str === 'string'));
          }
          const parsedEvents = parseCalendarPdfPages(pages);
          if (!parsedEvents.length) {
            throw new Error('No dated events were found. Try a text-based PDF with event names and dates; scanned image-only calendars are not supported.');
          }
          setImportPreview({ events: parsedEvents, fileName: file.name });
        } catch (error) {
          setPdfError(error.message || 'Could not read this PDF calendar. Please try another file.');
        } finally {
          if (pdf) {
            try {
              await pdf.destroy();
            } catch (cleanupError) {
              console.error('Could not close PDF reader cleanly.', cleanupError);
            }
          }
          setIsParsingPdf(false);
        }
      };

      const updatePreviewEvent = (index, changes) => {
        setImportPreview(current => current && ({
          ...current,
          events: current.events.map((event, eventIndex) => eventIndex === index ? { ...event, ...changes } : event)
        }));
      };

      const importPreviewEvents = () => {
        if (!importPreview?.events.length) return;
        onImportEvents(importPreview.events);
        setImportPreview(null);
      };

      const filteredEvents = useMemo(() => {
        return events.filter(ev => {
          if (categoryFilter !== 'all' && ev.category !== categoryFilter) return false;
          if (rsvpFilter === 'going' && ev.rsvp !== 'going') return false;
          if (rsvpFilter === 'interested' && ev.rsvp !== 'interested') return false;
          const search = searchQuery.trim().toLowerCase();
          if (search && !`${ev.title} ${ev.venue} ${ev.category} ${ev.date}`.toLowerCase().includes(search)) return false;
          return true;
        });
      }, [events, categoryFilter, rsvpFilter, searchQuery]);

      // Split into Upcoming and Past
      const upcomingEvents = useMemo(() => {
        return filteredEvents
          .filter(ev => getDaysDiff(ev.date) >= 0)
          .sort((a, b) => new Date(a.date) - new Date(b.date));
      }, [filteredEvents]);

      const pastEvents = useMemo(() => {
        return filteredEvents
          .filter(ev => getDaysDiff(ev.date) < 0)
          .sort((a, b) => new Date(b.date) - new Date(a.date));
      }, [filteredEvents]);

      const renderEventCard = (ev, isPast = false) => {
        const diff = getDaysDiff(ev.date);
        const dateParts = ev.date ? ev.date.split('-') : [];
        const monthNames = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
        const monthStr = dateParts[1] ? monthNames[parseInt(dateParts[1], 10) - 1] : 'DATE';
        const dayStr = dateParts[2] || '--';

        return (
          <div
            key={ev.id}
            className={`p-5 rounded-2xl border transition-all flex flex-col justify-between space-y-4 ${
              isPast
                ? 'border-slate-200 dark:border-dark-border/60 bg-white/70 dark:bg-dark-card/60 opacity-80'
                : 'border-slate-200 dark:border-dark-border bg-white dark:bg-dark-card shadow-sm hover:border-indigo-500/40'
            }`}
          >
            <div className="space-y-3">
              
              {/* Top row: Date block + Category badge & Countdown */}
              <div className="flex items-start justify-between gap-3">
                <div className="flex items-center gap-3">
                  {/* Date Block */}
                  <div className={`w-12 h-12 rounded-xl flex flex-col items-center justify-center text-center flex-shrink-0 border ${
                    isPast
                      ? 'bg-slate-100 dark:bg-dark-border border-slate-200 dark:border-slate-700'
                      : 'bg-indigo-50 dark:bg-indigo-950/60 border-indigo-100 dark:border-indigo-900/60'
                  }`}>
                    <span className={`text-[9px] font-extrabold uppercase leading-none ${
                      isPast ? 'text-slate-500' : 'text-indigo-600 dark:text-indigo-400'
                    }`}>
                      {monthStr}
                    </span>
                    <span className="text-base font-extrabold text-slate-900 dark:text-white leading-tight mt-0.5">
                      {dayStr}
                    </span>
                  </div>

                  <div>
                    <span className="text-[10px] font-extrabold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300">
                      {ev.category}
                    </span>
                    <p className="text-[11px] text-slate-400 mt-1 flex items-center gap-1">
                      <Icon name="clock" className="w-3 h-3" />
                      <span>{ev.time}</span>
                    </p>
                  </div>
                </div>

                {/* Countdown Badge */}
                <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full flex-shrink-0 ${
                  diff < 0 ? 'bg-slate-100 dark:bg-dark-border text-slate-400' :
                  diff === 0 ? 'bg-rose-500 text-white animate-pulse' :
                  diff === 1 ? 'bg-amber-500 text-white' :
                  diff <= 7 ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-dark-border text-slate-600 dark:text-slate-300'
                }`}>
                  {diff < 0 ? 'Past Event' : diff === 0 ? 'Today!' : diff === 1 ? 'Tomorrow' : `In ${diff} days`}
                </span>
              </div>

              {/* Title & Description */}
              <div>
                <h3 className="font-bold text-base text-slate-900 dark:text-slate-100 leading-snug">
                  {ev.title}
                </h3>
                {ev.description && (
                  <p className="text-xs text-slate-500 dark:text-slate-400 line-clamp-2 leading-relaxed mt-1">
                    {ev.description}
                  </p>
                )}
              </div>

              {/* Location */}
              <div className="flex items-center gap-1.5 text-xs text-slate-500 dark:text-slate-400 pt-1">
                <Icon name="mapPin" className="w-3.5 h-3.5 text-slate-400 flex-shrink-0" />
                <span className="truncate">{ev.venue}</span>
              </div>
            </div>

            {/* RSVP & Action Controls */}
            <div className="pt-3 border-t border-slate-100 dark:border-dark-border flex items-center justify-between">
              <button
                onClick={() => onToggleRsvp(ev.id)}
                className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${
                  ev.rsvp === 'going'
                    ? 'bg-emerald-600 text-white shadow-sm'
                    : ev.rsvp === 'interested'
                    ? 'bg-amber-100 dark:bg-amber-950 text-amber-700 dark:text-amber-300'
                    : 'bg-slate-100 dark:bg-dark-border text-slate-600 dark:text-slate-400 hover:text-slate-900'
                }`}
              >
                <Icon name={ev.rsvp === 'going' ? 'check' : 'star'} className="w-3.5 h-3.5" />
                {ev.rsvp === 'going' ? 'Going' : ev.rsvp === 'interested' ? 'Interested' : 'RSVP'}
              </button>

              <div className="flex items-center gap-1">
                <button
                  onClick={() => onEditEvent(ev)}
                  className="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
                  title="Edit Event"
                >
                  <Icon name="edit" className="w-3.5 h-3.5" />
                </button>
                <button
                  onClick={() => onDeleteEvent(ev.id)}
                  className="p-1.5 rounded-lg text-slate-400 hover:text-rose-500"
                  title="Delete Event"
                >
                  <Icon name="trash" className="w-3.5 h-3.5" />
                </button>
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className="space-y-6">
          <section className="p-4 sm:p-5 rounded-2xl border border-indigo-200 dark:border-indigo-900/60 bg-gradient-to-r from-indigo-50 to-sky-50 dark:from-indigo-950/30 dark:to-sky-950/20 shadow-sm">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div className="flex items-start gap-3">
                <span className="p-2.5 rounded-xl bg-white dark:bg-dark-card text-indigo-600 dark:text-indigo-400 shadow-sm">
                  <Icon name="calendar" className="w-5 h-5" />
                </span>
                <div>
                  <h3 className="font-bold text-sm">Import your college calendar</h3>
                  <p className="text-xs text-slate-600 dark:text-slate-400 mt-1">
                    Upload a PDF and we’ll find dated events and sort them into categories for you.
                  </p>
                  <p className="text-[11px] text-slate-500 dark:text-slate-500 mt-1">PDF is read in this browser. Review the event list before adding it.</p>
                </div>
              </div>
              <label className={`inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-md cursor-pointer whitespace-nowrap ${isParsingPdf ? 'opacity-60 pointer-events-none' : ''}`}>
                <Icon name="upload" className="w-4 h-4" />
                {isParsingPdf ? 'Reading calendar…' : 'Choose calendar PDF'}
                <input type="file" accept="application/pdf,.pdf" onChange={handleCalendarPdfUpload} disabled={isParsingPdf} className="hidden" />
              </label>
            </div>
          </section>

          {pdfError && (
            <div role="alert" className="p-3 rounded-xl border border-rose-200 dark:border-rose-900 bg-rose-50 dark:bg-rose-950/30 text-xs text-rose-700 dark:text-rose-300">
              {pdfError}

          {importPreview && (
            <section className="p-4 sm:p-5 rounded-2xl border border-indigo-200 dark:border-indigo-900 bg-white dark:bg-dark-card space-y-4">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">

          <button
            type="button"
            onClick={onToggleTheme}
            title="Toggle Dark / Light Theme"
            className="absolute top-5 right-5 p-2.5 rounded-xl border border-slate-200 dark:border-dark-border bg-white dark:bg-dark-card text-slate-600 dark:text-slate-300"
          >
            <Icon name={isDark ? 'sun' : 'moon'} className="w-4 h-4" />
          </button>

          <div className="relative w-full max-w-lg rounded-3xl border border-slate-200 dark:border-dark-border bg-white/95 dark:bg-dark-card/95 shadow-2xl p-6 sm:p-9">
            <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-sky-400 text-white flex items-center justify-center shadow-lg shadow-indigo-500/25 mb-6">
              <Icon name="pulse" className="w-6 h-6" />
            </div>
            <p className="text-xs uppercase tracking-[0.2em] font-bold text-indigo-600 dark:text-indigo-400 mb-2">College Bhai</p>
            <h1 className="text-2xl sm:text-3xl font-extrabold tracking-tight">Make your campus hub yours</h1>
            <p className="mt-2 text-sm text-slate-500 dark:text-slate-400 leading-relaxed">
              Add your student details to get started. You can add your own subjects, assignments, events, and grades after setup.
            </p>

            <form onSubmit={handleSubmit} className="mt-7 space-y-4">
              <div>
                <label htmlFor="setup-name" className="block text-xs font-semibold mb-1.5">Full name *</label>
                <input id="setup-name" type="text" required autoComplete="name" value={name} onChange={e => setName(e.target.value)} placeholder="Your name"
                  className="w-full px-3.5 py-3 rounded-xl border border-slate-200 dark:border-dark-border bg-slate-50 dark:bg-dark-bg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
              </div>
              <div>
                <label htmlFor="setup-college" className="block text-xs font-semibold mb-1.5">College or university</label>
                <input id="setup-college" type="text" value={college} onChange={e => setCollege(e.target.value)} placeholder="Your college"
                  className="w-full px-3.5 py-3 rounded-xl border border-slate-200 dark:border-dark-border bg-slate-50 dark:bg-dark-bg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label htmlFor="setup-year-branch" className="block text-xs font-semibold mb-1.5">Year & branch *</label>
                  <input id="setup-year-branch" type="text" required value={yearBranch} onChange={e => setYearBranch(e.target.value)} placeholder="e.g. 2nd Year · CSE"
                    className="w-full px-3.5 py-3 rounded-xl border border-slate-200 dark:border-dark-border bg-slate-50 dark:bg-dark-bg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
                </div>
                <div>
                  <label htmlFor="setup-roll-no" className="block text-xs font-semibold mb-1.5">Roll number (optional)</label>
                  <input id="setup-roll-no" type="text" value={rollNo} onChange={e => setRollNo(e.target.value)} placeholder="Your student ID"
                    className="w-full px-3.5 py-3 rounded-xl border border-slate-200 dark:border-dark-border bg-slate-50 dark:bg-dark-bg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
                </div>
              </div>
              <button type="submit" className="w-full mt-2 px-5 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold shadow-lg shadow-indigo-600/20">
                Create my student profile
              </button>
            </form>

            <div className="mt-5 flex items-center justify-center gap-2 text-[11px] text-slate-400">
              <Icon name="checkCircle" className="w-3.5 h-3.5" />
              <span>No account needed. Your data stays in this browser.</span>
            </div>
          </div>
        </div>
      );
    }

    // --- MODAL: EDIT STUDENT PROFILE ---
    function ProfileModal({ profile, onClose, onSave }) {
      const [name, setName] = useState(profile?.name || '');
      const [college, setCollege] = useState(profile?.college || '');
      const [yearBranch, setYearBranch] = useState(profile?.yearBranch || '');
      const [rollNo, setRollNo] = useState(profile?.rollNo || '');
      const [initials, setInitials] = useState(profile?.initials || '');

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave({
          name: name.trim() || 'Student',
          college: college.trim(),
          yearBranch: yearBranch.trim(),
          rollNo: rollNo.trim(),
          initials: initials.trim() || (name.trim().slice(0, 2).toUpperCase() || 'ST')
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in">
          <div className="w-full max-w-md p-6 rounded-3xl bg-white dark:bg-dark-card border border-slate-200 dark:border-dark-border shadow-2xl space-y-4">
            <div className="flex items-center justify-between">
              <h3 className="font-extrabold text-lg text-slate-900 dark:text-slate-100 flex items-center gap-2">
                <Icon name="user" className="w-5 h-5 text-indigo-600 dark:text-indigo-400" />
                Student Profile
              </h3>
              <button onClick={onClose} className="p-1 rounded-lg text-slate-400 hover:text-slate-600">
                <Icon name="x" className="w-4 h-4" />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="text-xs font-semibold text-slate-600 dark:text-slate-300 block mb-1">
                  Full Name *
                </label>
                <input
                  type="text"
                  required
                  placeholder="Your name"
                  value={name}
                  onChange={e => {
                    setName(e.target.value);
                    const parts = e.target.value.trim().split(' ');
                    if (parts.length >= 2) {
                      setInitials((parts[0][0] + parts[1][0]).toUpperCase());
                    } else if (parts.length === 1 && parts[0].length >= 2) {
                      setInitials(parts[0].slice(0, 2).toUpperCase());
                    }
                  }}
                  className="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-dark-border bg-slate-50 dark:bg-dark-bg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs font-semibold text-slate-600 dark:text-slate-300 block mb-1">
                    Year & Branch *
                  </label>
                  <input
                    type="text"
                    required
                    placeholder="e.g. 2nd Year · CSE"
                    value={yearBranch}
                    onChange={e => setYearBranch(e.target.value)}
                    className="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-dark-border bg-slate-50 dark:bg-dark-bg text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                  />
                </div>

                <div>
                  <label className="text-xs font-semibold text-slate-600 dark:text-slate-300 block mb-1">
                    College or University
                  </label>
                  <input
                    type="text"
                    placeholder="Your college"
                    value={college}
                    onChange={e => setCollege(e.target.value)}
                    className="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-dark-border bg-slate-50 dark:bg-dark-bg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                  />
                </div>

                <div>
                  <label className="text-xs font-semibold text-slate-600 dark:text-slate-300 block mb-1">
                    Roll No / ID
                  </label>
                  <input
                    type="text"
                    placeholder="e.g. 21BCSE104"
                    value={rollNo}
                    onChange={e => setRollNo(e.target.value)}
                    className="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-dark-border bg-slate-50 dark:bg-dark-bg text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                  />
                </div>
              </div>

              <div>
                <label className="text-xs font-semibold text-slate-600 dark:text-slate-300 block mb-1">
                  Avatar Initials (2 Letters)
                </label>
                <input
                  type="text"
                  maxLength="3"
                  value={initials}
                  onChange={e => setInitials(e.target.value.toUpperCase())}
                  className="w-24 px-3.5 py-2 rounded-xl border border-slate-200 dark:border-dark-border bg-slate-50 dark:bg-dark-bg text-sm uppercase font-bold focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                />
              </div>

              <div className="flex justify-end gap-2 pt-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 rounded-xl border border-slate-200 dark:border-dark-border text-xs font-semibold"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-md shadow-indigo-600/20"
                >
                  Save Profile
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Mount Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
